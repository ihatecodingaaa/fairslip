[project]
name = "fairslip"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]  # httpx backs fastapi.testclient.TestClient

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
